[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-hunter"
version = "1.0.0"
description = "Rarity x recurrence OSINT seed miner — find codenames, leaks, and anomalies in any corpus"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
nlp = ["nltk>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
